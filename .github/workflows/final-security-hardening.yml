name: Final security hardening

on:
  push:
    branches:
      - feat/production-integration-v1
    paths:
      - .github/workflows/final-security-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/production-integration-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply audited authorization and session fixes
        run: python3 .github/scripts/final_hardening.py
      - name: Format Rust source
        run: cargo fmt --manifest-path apps/api/Cargo.toml
      - name: Commit hardening and remove bootstrap tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-security-hardening.yml .github/scripts/final_hardening.py
          git add apps/api/src/main.rs apps/api/migrations/0002_operational_integrity.sql
          git commit -m "security(api): enforce private shipment access"
          git push origin HEAD:feat/production-integration-v1