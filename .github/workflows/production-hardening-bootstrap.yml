name: Production hardening bootstrap

on:
  push:
    branches:
      - feat/production-integration-v1
    paths:
      - .github/workflows/production-hardening-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/production-integration-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply audited API policy changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/main.rs")
          text = path.read_text()

          replacements = [
              (
                  '    if password.chars().count() < 12 {\n        return Err("ADMIN_PASSWORD must contain at least 12 characters".into());\n    }',
                  '    let password_length = password.chars().count();\n    if !(15..=128).contains(&password_length) {\n        return Err("ADMIN_PASSWORD must contain 15 to 128 characters".into());\n    }',
              ),
              (
                  '    if req.password.chars().count() < 8 {\n        return json_error(\n            StatusCode::BAD_REQUEST,\n            "Password must contain at least 8 characters",\n        );\n    }',
                  '    let password_length = req.password.chars().count();\n    if !(15..=128).contains(&password_length) {\n        return json_error(\n            StatusCode::BAD_REQUEST,\n            "Password must contain 15 to 128 characters",\n        );\n    }',
              ),
              (
                  '"rohbar_session={sid}; Path=/; HttpOnly; SameSite=Lax; Max-Age=2592000{}"',
                  '"rohbar_session={sid}; Path=/; HttpOnly; SameSite=Lax; Max-Age=604800{}"',
              ),
              ('            2_592_000,', '            604_800,'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          visibility = "status IN ('published','offered','accepted','in_transit','delivered')"
          visibility_count = text.count(visibility)
          if visibility_count < 1:
              raise SystemExit("shipment visibility status list not found")
          text = text.replace(
              visibility,
              "status IN ('published','offered','accepted','in_transit','delivered','completed')",
          )

          path.write_text(text)
          PY
          cargo fmt --manifest-path apps/api/Cargo.toml
      - name: Commit hardening and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/production-hardening-bootstrap.yml
          git add apps/api/src/main.rs
          git commit -m "security(api): harden password and session policy"
          git push origin HEAD:feat/production-integration-v1
