name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          version: 12.3.4
          runtime: node@26
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web typecheck:compat
      - run: pnpm --dir apps/web build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: rohbar
          POSTGRES_USER: rohbar
          POSTGRES_PASSWORD: rohbar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rohbar -d rohbar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://rohbar:rohbar_ci@127.0.0.1:5432/rohbar
      REDIS_URL: redis://127.0.0.1:6379
      RUST_LOG: info
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api -> apps/api/target
      - run: rustc --version
      - run: cargo fmt --manifest-path apps/api/Cargo.toml --check
      - run: cargo check --manifest-path apps/api/Cargo.toml --locked
      - run: cargo clippy --manifest-path apps/api/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path apps/api/Cargo.toml --locked

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: rohbar_ci_container_password
          FRONTEND_ORIGIN: https://rohbar.example.test
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Validate production Nginx configuration
        shell: bash
        run: |
          set -euo pipefail
          CERT_ROOT="$RUNNER_TEMP/rohbar-nginx-certs"
          mkdir -p "$CERT_ROOT/rohbar.vosiev.com" "$CERT_ROOT/rohbar-api.vosiev.com"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=rohbar.vosiev.com" \
            -keyout "$CERT_ROOT/rohbar.vosiev.com/privkey.pem" \
            -out "$CERT_ROOT/rohbar.vosiev.com/fullchain.pem" >/dev/null 2>&1
          cp "$CERT_ROOT/rohbar.vosiev.com/privkey.pem" "$CERT_ROOT/rohbar-api.vosiev.com/privkey.pem"
          cp "$CERT_ROOT/rohbar.vosiev.com/fullchain.pem" "$CERT_ROOT/rohbar-api.vosiev.com/fullchain.pem"
          docker run --rm \
            -v "$PWD/infra/nginx/rohbar.conf.example:/etc/nginx/conf.d/default.conf:ro" \
            -v "$CERT_ROOT:/etc/letsencrypt/live:ro" \
            nginx:alpine nginx -t
      - name: Build API production image
        run: docker build --file apps/api/Dockerfile --tag rohbar-api:ci apps/api
      - name: Build web production image
        run: docker build --file apps/web/Dockerfile --tag rohbar-web:ci .
