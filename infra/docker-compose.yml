services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rohbar
      POSTGRES_USER: rohbar
      POSTGRES_PASSWORD: rohbar
    volumes:
      - rohbar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rohbar -d rohbar"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rohbar_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rohbar:rohbar@postgres:5432/rohbar
      REDIS_URL: redis://redis:6379
      BIND_ADDR: 0.0.0.0:8080
      FRONTEND_ORIGIN: http://localhost:3000
      SESSION_COOKIE_SECURE: "false"
      RUST_LOG: info
    ports:
      - "8080:8080"

volumes:
  rohbar_postgres:
  rohbar_redis:
