services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: rohbar
      POSTGRES_USER: rohbar
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - rohbar_codespaces_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rohbar -d rohbar"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - rohbar_codespaces_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: postgresql://rohbar@postgres:5432/rohbar
      REDIS_URL: redis://redis:6379
      BIND_ADDR: 0.0.0.0:8080
      FRONTEND_ORIGIN: http://localhost:3000
      SESSION_COOKIE_SECURE: "false"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  rohbar_codespaces_postgres:
  rohbar_codespaces_redis:
